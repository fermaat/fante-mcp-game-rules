schema_version: 1
pack_name: physics_basic
pack_version: "0.1.0"
domain: physical
complexity_tier: 1
description: Basic physical actions — climbing, dodging, swimming, lifting.
default_dice_policy:
  d20s: 1
  keep: highest
  plot_dice: 0
skills:
  athletics: strength
  acrobatics: speed
  endurance: willpower
rules:
  - id: climb
    description: Attempt to climb a rocky surface.
    attribute: strength
    skill: athletics
    base_difficulty: 10
    knowledge_topic: adventure
    challenge: optional
    challenge_category: physical
    modifiers:
      - when:
          field: context.surface
          op: eq
          value: wet
        delta: -5
        reason: wet surface grip
    on_success: "You scramble up with effort."
    on_failure: "You slip and fall back down."
    complexity_tier: 1

  - id: dodge_falling_rocks
    description: Dodge a shower of falling rocks.
    attribute: speed
    skill: acrobatics
    base_difficulty: 12
    knowledge_topic: adventure
    challenge: optional
    challenge_category: reflexes
    dice_policy:
      d20s: 2
      keep: lowest
      plot_dice: 0
    modifiers:
      - when:
          field: actor.tags
          op: contains
          value: heavy_armor
        delta: -2
        reason: heavy armor restricts movement
    on_success: "You roll clear of the rocks."
    on_failure: "A rock strikes you square on the shoulder."
    complexity_tier: 1

  - id: swim_short
    description: Swim a short distance through open water.
    attribute: strength
    skill: endurance
    base_difficulty: 8
    knowledge_topic: adventure
    challenge: optional
    challenge_category: physical
    modifiers:
      - when:
          field: context.current
          op: eq
          value: strong
        delta: -3
        reason: strong current makes swimming harder
    on_success: "You make it across with steady strokes."
    on_failure: "The water pulls you back."
    complexity_tier: 1

  - id: lift_heavy
    description: Lift a heavy object overhead.
    attribute: strength
    base_difficulty: 14
    knowledge_topic: adventure
    challenge: optional
    challenge_category: physical
    modifiers:
      - when:
          field: actor.attributes.strength
          op: gte
          value: 5
        delta: 3
        reason: exceptional strength gives extra leverage
    on_success: "You hoist the weight overhead."
    on_failure: "The object barely budges."
    complexity_tier: 1

  - id: jump
    description: Jump over an obstacle or gap.
    attribute: speed
    skill: acrobatics
    base_difficulty: 10
    knowledge_topic: adventure
    challenge: optional
    challenge_category: reflexes
    modifiers:
      - when:
          field: context.distance
          op: eq
          value: long
        delta: -3
        reason: long distance is harder
    on_success: "You leap clean across."
    on_failure: "Your foot misses — you fall short."
    complexity_tier: 1

  - id: grab
    description: Grab something just within reach.
    attribute: speed
    skill: acrobatics
    base_difficulty: 11
    knowledge_topic: adventure
    challenge: optional
    challenge_category: reflexes
    modifiers:
      - when:
          field: context.moving
          op: eq
          value: true
        delta: -2
        reason: moving target is trickier
    on_success: "Your fingers close around it just in time."
    on_failure: "It slips away."
    complexity_tier: 1

  - id: push
    description: Push a heavy object out of the way.
    attribute: strength
    base_difficulty: 11
    knowledge_topic: adventure
    challenge: optional
    challenge_category: physical
    modifiers:
      - when:
          field: context.weight
          op: eq
          value: heavy
        delta: -3
        reason: very heavy object
    on_success: "You shove it aside with a grunt."
    on_failure: "It barely moves — too heavy."
    complexity_tier: 1

  - id: pull
    description: Pull a rope or lever towards you.
    attribute: strength
    base_difficulty: 10
    knowledge_topic: adventure
    challenge: optional
    challenge_category: physical
    on_success: "You yank it free."
    on_failure: "It resists, then snaps back."
    complexity_tier: 1
